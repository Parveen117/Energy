name: e01-audit
on: [push, pull_request]
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install numpy pytest
      - run: python -m pytest tests -q
      - name: regenerate certificate and diff against pinned
        run: |
          python campaigns/E01_CELL_CHART_AUDIT/run_e01.py
          git diff --exit-code results/E01_CERTIFICATE.json
      - name: verify all pinned certificates and canonical root
        run: |
          python scripts/verify_certificates.py
          git diff --exit-code results/CANONICAL_ROOT.txt
